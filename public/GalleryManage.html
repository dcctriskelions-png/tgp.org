<div class="ph"><span class="phi"><i class="ico ico-gallery"></i></span><div><h1>Gallery</h1><p class="muted">Create albums for your projects and services. Members see the same albums after they log in.</p></div></div>
<style>
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gp{background:#fff;border:1px solid var(--g200);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1);transition:.2s;display:flex;flex-direction:column}
.gp:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:#e4d08a}
.gp img,.gp .ph0{width:100%;height:156px;object-fit:cover;display:block;background:var(--g100)}
.gp .ph0{display:grid;place-items:center;font-size:34px;color:var(--golddk);background:linear-gradient(135deg,#f5f1e2,#ebe5d0)}
.gp .ct{padding:11px 12px 12px;font-size:12.5px;color:var(--g700);word-break:break-word;flex:1}
.gp .ct b{font-size:14px;color:var(--ink)}
.gp .btn{padding:6px 10px;margin:8px 4px 0 0;font-size:11.5px;border-radius:8px}
.gp select{margin-top:8px;padding:8px 30px 8px 10px;font-size:12px}
.gtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.gtools input[type=file]{max-width:280px}.gtools #gcap{max-width:320px}
</style>
<div id="gmsg" style="font-size:13px;margin:8px 0;min-height:16px;font-weight:600"></div>
<div id="gwrap"></div>
<script>
var GALB = [], GPH = [], GCUR = '';
function gUrl(id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w; }
function gmsg(t, ok) { var m = document.getElementById('gmsg'); m.textContent = t; m.style.color = ok ? '#166534' : '#991b1b'; }
function gCall(h) { return google.script.run.withSuccessHandler(function (r) { if (r && r.expired) return expired(); h(r); }).withFailureHandler(function (e) { gmsg(e.message, false); }); }
function gDone(r) { if (r && r.success) { gmsg('', true); loadGallery(); } else gmsg((r && r.message) || 'Failed.', false); }
function loadGallery() {
  gCall(function (r) {
    if (!r || !r.success) return gmsg((r && r.message) || 'Failed to load.', false);
    GALB = r.albums; GPH = r.photos || [];
    if (GCUR && !GALB.some(function (a) { return a.id === GCUR; })) GCUR = '';
    GCUR ? drawAlbum() : drawAlbums();
  }).getGallery(TOKEN, GCUR);
}
function drawAlbums() {
  document.getElementById('gwrap').innerHTML = '<div class="bar"><button class="btn btn-ic ico-plus" onclick="newAlbum()">New Album</button><button class="btn dark btn-ic ico-refresh" onclick="loadGallery()">Refresh</button></div><div class="gg">' +
    GALB.map(function (a, i) {
      return '<div class="gp">' + (a.cover ? '<img loading="lazy" src="' + gUrl(a.cover, 400) + '" alt="">' : '<div class="ph0"><i class="ico ico-gallery"></i></div>') +
        '<div class="ct"><b>' + esc(a.name) + '</b><br>' + a.count + ' photo(s)' + (a.description ? '<br>' + esc(a.description) : '') + '<br>' +
        '<button class="btn dark" onclick="openAlbum(' + i + ')">Open</button><button class="btn gray" onclick="editAlbum(' + i + ')">Edit</button>' +
        '<button class="btn red" onclick="delAlbum(' + i + ')">Delete</button></div></div>';
    }).join('') + '</div>';
}
function drawAlbum() {
  var al = GALB.filter(function (a) { return a.id === GCUR; })[0];
  document.getElementById('gwrap').innerHTML =
    '<div class="bar"><button class="btn gray btn-ic ico-back" onclick="GCUR=\'\';loadGallery()">All albums</button><b style="font-size:16px">' + esc(al.name) + '</b></div>' +
    '<div class="gtools"><input type="file" id="gfile" accept="image/jpeg,image/png,image/webp" multiple>' +
    '<input id="gcap" maxlength="200" placeholder="Caption (optional, for all selected)"><button class="btn btn-ic ico-upload" id="gup" onclick="uploadGallery()">Upload to this album</button></div><div class="gg">' +
    (GPH.map(function (p, i) {
      return '<div class="gp"><a href="' + gUrl(p.fileId, 1600) + '" target="_blank" rel="noopener"><img loading="lazy" src="' + gUrl(p.fileId, 400) + '" alt=""></a><div class="ct">' + esc(p.caption || '—') + '<br>' +
        '<button class="btn gray" onclick="capGallery(' + i + ')">Caption</button><button class="btn red" onclick="delGallery(' + i + ')">Delete</button><br>' +
        '<select onchange="moveGallery(' + i + ',this.value)"><option value="">Move to...</option>' +
        GALB.filter(function (a) { return a.id !== GCUR; }).map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.name) + '</option>'; }).join('') + '</select></div></div>';
    }).join('') || '<div class="wrap" style="padding:16px;grid-column:1/-1;color:var(--g600)">No photos in this album yet.</div>') + '</div>';
}
function openAlbum(i) { GCUR = GALB[i].id; loadGallery(); }
function newAlbum() {
  var n = prompt('Album name (e.g. Medical Mission 2026):'); if (!n) return;
  var d = prompt('Short description (optional):') || '';
  gCall(gDone).saveAlbum(TOKEN, '', n, d);
}
function editAlbum(i) {
  var n = prompt('Album name:', GALB[i].name); if (!n) return;
  var d = prompt('Short description:', GALB[i].description || '');
  gCall(gDone).saveAlbum(TOKEN, GALB[i].id, n, d === null ? GALB[i].description : d);
}
function delAlbum(i) {
  if (!confirm('Delete the album "' + GALB[i].name + '"? (Only empty albums can be deleted.)')) return;
  gCall(gDone).deleteAlbum(TOKEN, GALB[i].id);
}
function moveGallery(i, albumId) { if (albumId) gCall(gDone).moveGalleryPhoto(TOKEN, GPH[i].id, albumId); }
function capGallery(i) {
  var t = prompt('Caption:', GPH[i].caption || ''); if (t === null) return;
  gCall(gDone).updateGalleryCaption(TOKEN, GPH[i].id, t);
}
function delGallery(i) {
  if (!confirm('Delete this photo? It will also be moved to the Drive trash.')) return;
  gCall(gDone).deleteGalleryPhoto(TOKEN, GPH[i].id);
}
function resizeImg(file, max, cb, fail) {
  var fr = new FileReader();
  fr.onerror = fail;
  fr.onload = function () {
    var img = new Image();
    img.onerror = fail;
    img.onload = function () {
      var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function uploadGallery() {
  var files = Array.prototype.slice.call(document.getElementById('gfile').files), cap = document.getElementById('gcap').value, btn = document.getElementById('gup'), album = GCUR;
  if (!files.length) return gmsg('Choose at least one image first.', false);
  btn.disabled = true;
  var n = 0, fails = 0;
  (function next() {
    if (n >= files.length) { gmsg(fails ? (files.length - fails) + ' uploaded, ' + fails + ' failed.' : 'Uploaded', !fails); loadGallery(); return; }
    gmsg('Uploading ' + (n + 1) + ' of ' + files.length + '...', true);
    resizeImg(files[n], 1280, function (data) {
      google.script.run
        .withSuccessHandler(function (r) { if (r && r.expired) return expired(); if (!r || !r.success) { fails++; gmsg((r && r.message) || 'Upload failed.', false); } n++; next(); })
        .withFailureHandler(function (e) { fails++; gmsg(e.message, false); n++; next(); })
        .uploadGalleryPhoto(TOKEN, data, cap, album);
    }, function () { fails++; n++; next(); });
  })();
}
</script>
