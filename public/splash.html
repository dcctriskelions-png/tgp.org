<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGP DCC</title>
<meta name="theme-color" content="#050608">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.json">
<style>
  :root { --t: 4s; }                      /* total time on screen, set by SPLASH_SECONDS below */
  html, body { margin: 0; width: 100%; height: 100%; background: #050608; overflow: hidden; }
  body { cursor: pointer; animation: fadein .5s ease-out both; }
  body.leave { animation: fadeout .5s ease-in both; }
  picture, img { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  img { object-fit: contain; background: #050608; animation: drift var(--t) ease-out both; }
  @keyframes drift  { from { transform: scale(1.05); opacity: .85; } to { transform: scale(1); opacity: 1; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body onclick="go()">
  <picture>
    <source srcset="/icons/splash-art.webp" type="image/webp">
    <img src="/icons/splash-art.jpg" alt="Tau Gamma Phi and Tau Gamma Sigma, Dipolog City Council - Membership Database System">
  </picture>
  <noscript><a href="/" style="position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#e8b83a;font:16px Arial">Continue</a></noscript>
<script>
  // How long the start-up screen stays, in seconds. Change this number (3 to 5 works well).
  var SPLASH_SECONDS = 5;

  document.documentElement.style.setProperty('--t', SPLASH_SECONDS + 's');
  var left = false;
  function go() {
    if (left) return; left = true;
    document.body.className = 'leave';
    setTimeout(function () { location.replace('/'); }, 450);
  }
  setTimeout(go, SPLASH_SECONDS * 1000);
</script>
</body>
</html>
