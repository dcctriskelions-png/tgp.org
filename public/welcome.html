<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TGP DCC">
<meta name="theme-color" content="#111111">
<title>ΤΓΦ & ΤΓΣ DCC (Membership Database)</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card: #181818;
    --gold-dark: #8a6314;
    --gold: #d4a017;
    --gold-light: #fff1b8;
    --muted: #cfcfcf;
    --logo-size: 92px;
    --logo-zoom: 1.22; /* raise/lower if the logos look cropped or too small in the circle */
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 50% 0%, #2a2108 0%, transparent 55%),
      var(--bg);
    color: #fff;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 16px;
  }

  /* ---------- single bordered box ---------- */
  .welcome-box {
    position: relative;
    width: 100%;
    max-width: 620px;
    background: linear-gradient(160deg, #202020 0%, #141414 100%);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 34px 22px 30px;
    text-align: center;
    /* glossy gold border */
    background-image:
      linear-gradient(160deg, #202020 0%, #141414 100%),
      linear-gradient(135deg, var(--gold-light), var(--gold) 30%, var(--gold-dark) 55%, var(--gold) 80%, var(--gold-light));
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 0 28px rgba(212,160,23,.25), 0 14px 40px rgba(0,0,0,.6);
    animation: rise .8s ease both;
  }
  .welcome-box::before { /* soft gloss highlight across the top */
    content: "";
    position: absolute; inset: 0 0 55% 0;
    border-radius: 14px 14px 60% 60% / 14px 14px 25% 25%;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0));
    pointer-events: none;
  }

  /* ---------- logos ---------- */
  .logos {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .logo {
    width: var(--logo-size);
    height: var(--logo-size);
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    border: 3px solid var(--gold);
    box-shadow:
      0 0 0 2px #000,
      0 0 14px rgba(212,160,23,.55),
      inset 0 0 8px rgba(0,0,0,.35);
    transition: transform .25s ease, box-shadow .25s ease;
    animation: rise .8s ease both;
  }
  .logo:nth-child(2) { animation-delay: .08s; }
  .logo:nth-child(3) { animation-delay: .16s; }
  .logo:nth-child(4) { animation-delay: .24s; }
  .logo:hover {
    transform: translateY(-4px) scale(1.06);
    box-shadow: 0 0 0 2px #000, 0 0 24px rgba(255,214,90,.9);
  }
  .logo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(var(--logo-zoom));
  }

  /* ---------- header text (glossy gold) ---------- */
  header h1 {
    margin: 0;
    font-size: 1.7rem;
    line-height: 1.25;
    letter-spacing: .6px;
    text-transform: uppercase;
  }
  header h1 span { display: block; }
  .gold-text {
    background: linear-gradient(100deg,
      var(--gold-dark) 0%, var(--gold) 25%, var(--gold-light) 45%,
      var(--gold) 60%, var(--gold-dark) 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.8));
    animation: shine 5s linear infinite;
  }
  header .sub {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 1px;
    margin-top: 8px;
  }
  header p { margin: 10px 0 0; font-size: 1.05rem; color: var(--muted); }

  /* ---------- glossy gold button ---------- */
  .register-btn {
    position: relative;
    display: inline-block;
    overflow: hidden;
    margin-top: 30px;
    padding: 15px 48px;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-decoration: none;
    color: #2b1d00;
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
    border-radius: 999px;
    border: 1px solid #fff2b0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 52%),
      linear-gradient(180deg, #f6d76b 0%, #d4a017 48%, #a87a0c 52%, #e2b73a 100%);
    box-shadow:
      0 6px 0 #6e4f06,
      0 10px 22px rgba(0,0,0,.55),
      0 0 22px rgba(212,160,23,.45),
      inset 0 1px 1px rgba(255,255,255,.8);
    transition: transform .15s ease, box-shadow .15s ease, filter .2s ease;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .register-btn::after { /* moving shine sweep */
    content: "";
    position: absolute; top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.2s ease-in-out infinite;
  }
  .register-btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
  .register-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #6e4f06, 0 4px 12px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.8);
    animation: none;
  }

  /* ---------- label ---------- */
  .note {
    margin: 26px 0 0;
    font-size: .78rem;
    font-weight: 600;
    line-height: 1.55;
    letter-spacing: .5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ---------- animations ---------- */
  @keyframes shine  { 0% { background-position: 0% 0; } 100% { background-position: -220% 0; } }
  @keyframes sweep  { 0%, 55% { left: -80%; } 100% { left: 140%; } }
  @keyframes pulse  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (max-width: 480px) {
    :root { --logo-size: 70px; }
    .logos { gap: 10px; }
    header h1 { font-size: 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="welcome-box">
    <div class="logos">
      <div class="logo"><img src="logo-tgp.png" alt="Tau Gamma Phi"></div>
      <div class="logo"><img src="logo-tgs.png" alt="Tau Gamma Sigma"></div>
      <div class="logo"><img src="logo-tym.png" alt="Triskelion Youth Movement"></div>
      <div class="logo"><img src="logo-tao.png" alt="Triskelion Alumni Organization"></div>
    </div>

    <header>
      <h1 class="gold-text">
        <span>Tau Gamma Phi &amp; Tau Gamma Sigma</span>
      </h1>
      <h1 class="sub gold-text" style="font-size:1.05rem;letter-spacing:1px;margin-top:8px;">
        <span>Membership Database System</span>
      </h1>
      <p>Dipolog City Council</p>
    </header>

    <a class="register-btn" href="member-form.html">REGISTER NOW</a>

    <p class="note">
      FOR INITIATED AND AFFILIATE MEMBERS OF TAU GAMMA PHI &amp; TAU GAMMA SIGMA - Dipolog City Council
    </p>
  </main>
</body>
</html>
