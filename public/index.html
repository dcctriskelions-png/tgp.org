.welcome-box{position:relative;width:100%;max-width:640px;text-align:center;padding:34px 22px 30px;border-radius:18px;border:2px solid transparent;
 background:linear-gradient(160deg,#202023,#121214) padding-box,linear-gradient(135deg,#fff1b8,#d4af37 28%,#8a6d14 55%,#d4af37 80%,#fff1b8) border-box;
 box-shadow:0 0 30px rgba(212,175,55,.25),0 18px 44px rgba(0,0,0,.65);animation:rise .8s ease both;overflow:hidden}
.welcome-box::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0))}
.welcome-box>*{position:relative}

h1{margin:0;font-size:1.55rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;line-height:1.3}
h1 span{display:block;margin-top:8px;font-size:.82rem;letter-spacing:.2em;font-weight:700}
.gold{background:linear-gradient(100deg,#8a6d14 0%,#d4af37 25%,#fff1b8 45%,#d4af37 60%,#8a6d14 100%);background-size:220% 100%;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
 filter:drop-shadow(0 1px 1px rgba(0,0,0,.8));animation:shine 5s linear infinite}
.council{margin:10px 0 0;color:var(--g400);font-size:13px;letter-spacing:.08em}

.register-btn{position:relative;display:inline-block;overflow:hidden;margin-top:30px;padding:15px 50px;border-radius:999px;border:1px solid #fff2b0;
 font:800 1.1rem var(--font);letter-spacing:.2em;text-decoration:none;color:#2b1d00;text-shadow:0 1px 0 rgba(255,255,255,.55);-webkit-tap-highlight-color:transparent;
 background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0) 52%),linear-gradient(180deg,#f6d76b 0%,#d4af37 48%,#a87a0c 52%,#e2b73a 100%);
 box-shadow:0 6px 0 #6e4f06,0 10px 22px rgba(0,0,0,.55),0 0 22px rgba(212,175,55,.45),inset 0 1px 1px rgba(255,255,255,.8);
 transition:transform .15s,box-shadow .15s,filter .2s;animation:pulse 2.6s ease-in-out infinite}
.register-btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;transform:skewX(-20deg);
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:sweep 3.2s ease-in-out infinite}
.register-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.register-btn:active{transform:translateY(4px);animation:none;box-shadow:0 2px 0 #6e4f06,0 4px 12px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.8)}
.register-btn:focus-visible{outline:3px solid rgba(246,231,173,.7);outline-offset:3px}

.note{margin:26px 0 0;font-size:.76rem;font-weight:600;line-height:1.6;letter-spacing:.06em;color:var(--g300);text-transform:uppercase}

@keyframes shine{0%{background-position:0 0}100%{background-position:-220% 0}}
@keyframes sweep{0%,55%{left:-80%}100%{left:140%}}
